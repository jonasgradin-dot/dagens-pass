<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dagens pass</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f8a63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dagens pass">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f1ee; --fg:#1c1b19; --muted:#6b6862; --card:#fff; --line:#dcd8d1; --accent:#1c1b19; --accent-fg:#f3f1ee;
  --work:#c8321f; --rest:#1f6f8b; --prep:#8a6a00; --done:#2e7d4f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171614;--fg:#f1eee9;--muted:#9a958c;--card:#222018;--line:#38352e;--accent:#f1eee9;--accent-fg:#171614}
}
:root[data-theme="dark"]{--bg:#171614;--fg:#f1eee9;--muted:#9a958c;--card:#222018;--line:#38352e;--accent:#f1eee9;--accent-fg:#171614}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  transition:background .35s;
  -webkit-tap-highlight-color:transparent;
}
body.work{background:var(--work);color:#fff}
body.rest{background:var(--rest);color:#fff}
body.prep{background:var(--prep);color:#fff}
body.done{background:var(--done);color:#fff}
main{height:100%;display:flex;flex-direction:column;padding:20px;max-width:520px;margin:0 auto;overflow-y:auto}
h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2rem;margin:8px 0 20px}
.hidden{display:none!important}

/* Inställningar */
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1.6rem;line-height:1;cursor:pointer}
.step button:active{background:var(--line)}
.val{min-width:84px;text-align:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2rem}
.total{color:var(--muted);text-align:center;margin:8px 0 auto}
.go{margin-top:20px;width:100%;height:64px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.6rem;cursor:pointer}

body.warm{background:#6a4c93;color:#fff}
body.cool{background:#55606e;color:#fff}
.today{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:8px}
.th{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;text-transform:capitalize}
.tm{color:var(--muted);font-size:.95rem;margin:2px 0 10px}
#t-list{columns:2;margin:0;padding-left:20px;line-height:1.6}
h2.sub{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.4rem;margin:22px 0 10px}
#fig{display:none;width:100%;flex:1 1 0;min-height:0;stroke:currentColor;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.hasfig #fig{display:block}
#fig.dim{opacity:.55}
.hasfig .time{flex:0 0 auto;font-size:clamp(4.5rem,22vw,7.5rem);padding:4px 0 12px}
.skip{margin-bottom:12px}
.ctrl.skip button{height:48px;font-size:1.25rem}
.gh{opacity:.45;stroke-width:4;stroke-dasharray:.1 9}
#f-tor{stroke-width:10}
#f-hd{fill:currentColor}
.hasfig #fig{min-height:90px}
.tip{display:none;margin:0 6px 4px;min-height:4em;font-size:.98rem;line-height:1.35}
.hasfig .tip{display:block}
.awake{font-size:.8rem;opacity:.75;margin:6px 0 0;min-height:1.2em}
.reps{display:none;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.3rem;margin:2px 0 4px;min-height:1.4em}
.hasfig .reps{display:block}
.hasfig .tip{min-height:3.4em;font-size:.92rem}
.tickbtn{align-self:center;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:6px 14px;font:inherit;font-size:.85rem;margin-top:6px;cursor:pointer}
#f-lab{fill:currentColor;stroke:none;font:700 10px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.03em}
#t-list{columns:1;padding-left:0}
.grp{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.exr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 8px;margin-bottom:6px;font:inherit;cursor:pointer}
.exr:active{background:var(--line)}
.exr svg{flex:0 0 68px;width:68px;height:41px;stroke:currentColor;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.exr b{display:block;font-weight:600}
.exr small{color:var(--muted)}
.exr .go2{margin-left:auto;color:var(--muted);font-size:1.5rem}
.gen{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0 0}
.gen b{font-weight:600}
.gen small{display:block;color:var(--muted)}
.gen .val{min-width:64px;font-size:1.7rem}
.rst{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.85rem;padding:6px 0 0;cursor:pointer}
.exth{background:none;border:0;padding:0;color:inherit;cursor:pointer;flex:0 0 68px}
.exc{flex:1;min-width:0}
.exn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.exs{display:flex;align-items:center;gap:6px;margin-top:4px}
.exs button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1.2rem;line-height:1;cursor:pointer}
.exs button:active{background:var(--line)}
.ev{min-width:46px;text-align:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.25rem}
.ev.custom{text-decoration:underline}
.exi{color:var(--muted);margin-left:4px}
:root{--warm-bg:#fcefd8;--warm-ac:#e8a94d;--warm-fg:#8a5712;--main-bg:#e2f0e3;--main-ac:#6dbb7f;--main-fg:#2b6a3a;--cool-bg:#e3e8f8;--cool-ac:#8c9be0;--cool-fg:#3a4a92;--rowbg:rgba(255,255,255,.65);--g1:#fbf6ee;--g2:#eaf1ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warm-bg:#3a3022;--warm-ac:#d79a42;--warm-fg:#f0c37a;--main-bg:#223529;--main-ac:#5aa56d;--main-fg:#9fd6ab;--cool-bg:#262b42;--cool-ac:#7d8ddb;--cool-fg:#b3bff5;--rowbg:rgba(255,255,255,.07);--g1:#1c1a17;--g2:#161c1c}}
body{background:linear-gradient(170deg,var(--g1),var(--g2)) fixed}
body.warm{background:#a56a14}
body.cool{background:#4a5aa6}
h1{font-size:2.4rem;margin:6px 0 2px}
.today{background:none;border:0;padding:0;margin:0}
.th{font-family:'Barlow',system-ui,sans-serif;font-weight:600;font-size:1.05rem;color:var(--muted)}
.tm{margin:2px 0 0}
.bar{display:flex;gap:3px;height:10px;margin:14px 0 6px}
.bar i{border-radius:6px}
.bar .warm,.leg .warm::before{background:var(--warm-ac)}
.bar .main,.leg .main::before{background:var(--main-ac)}
.bar .cool,.leg .cool::before{background:var(--cool-ac)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.leg span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.go{background:linear-gradient(135deg,#3f8a63,#3a7f8f);color:#fff;height:68px;border-radius:20px;box-shadow:0 6px 18px rgba(58,127,143,.28)}
.gen{background:var(--card);border:0;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin:16px 0 0}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:16px 0 0}
.blk{--bb:var(--card);--ba:var(--line);--bf:var(--fg);background:var(--bb);border-left:6px solid var(--ba);border-radius:20px;padding:12px 12px 6px 10px;margin:12px 0}
.blk.warm{--bb:var(--warm-bg);--ba:var(--warm-ac);--bf:var(--warm-fg)}
.blk.main{--bb:var(--main-bg);--ba:var(--main-ac);--bf:var(--main-fg)}
.blk.cool{--bb:var(--cool-bg);--ba:var(--cool-ac);--bf:var(--cool-fg)}
.bh{display:flex;align-items:baseline;justify-content:space-between;color:var(--bf);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;padding:0 4px 8px}
.bh small{font-family:'Barlow',system-ui,sans-serif;font-weight:600;font-size:.85rem}
.blk .exr{background:var(--rowbg);border-color:transparent}
.blk .exr:active{background:var(--bb)}
.blk .exth svg{color:var(--bf)}
.blk .exs button{border-color:var(--ba);color:var(--bf)}
.blk .ev{color:var(--bf)}
.blk .exi{color:var(--bf);opacity:.8}
.gen+.gen{margin-top:8px}
.rs{margin-top:2px}
.exl{min-width:36px;opacity:.85}
.blk .exl{color:var(--bf)}
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.seg button{flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--fg);font:inherit;font-weight:600;font-size:1rem;cursor:pointer}
.seg button.on{color:#fff}
.seg button[data-l="0"].on{background:#3f8f64}
.seg button[data-l="1"].on{background:#b97a14}
.seg button[data-l="2"].on{background:#c04a3b}
.ldinfo{color:var(--muted);font-size:.9rem;margin:6px 2px 0;min-height:1.3em}
body.rbreak{background:#2a7f6f;color:#fff}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.pepp{display:none;text-align:center;font-size:1.3rem;font-weight:600;line-height:1.3;margin:0 10px 18px}
body.done .pepp{display:block;animation:fadein .9s 1.4s both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nextbox{display:none;margin:6px 8px 0;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.2)}
.nextbox small{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.nextbox b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2rem;line-height:1.1}
.hasfig #fig.dim{opacity:.85}
#welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:8px 4px}
#welcome.hidden{display:none}
.w-emoji{font-size:4.2rem;line-height:1;margin-bottom:6px;animation:flexy 1.6s ease-in-out infinite alternate}
@keyframes flexy{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.08)}}
.w-hi{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:3rem;line-height:1.05;margin:4px 0 10px}
.w-msg{font-size:1.2rem;line-height:1.4;margin:0 6px 16px}
.w-quote{background:none;border-radius:0;padding:6px 12px 8px;box-shadow:none;text-align:left;transform:rotate(-2.5deg);transform-origin:50% 50%}
main{overflow-x:hidden}
.w-qh{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.w-q{font-family:'Caveat','Bradley Hand','Segoe Script','Comic Sans MS',cursive;font-weight:500;font-size:1.75rem;font-style:normal;line-height:1.2;margin:0}
.w-a{color:var(--muted);margin:10px 0 0;font-size:.95rem}
.w-note{color:var(--muted);font-size:.78rem;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.w-emoji{animation:none}}
.w-by{display:flex;flex-direction:row-reverse;justify-content:flex-start;align-items:center;gap:12px;margin:8px 14px 0 0;color:var(--muted)}
.w-by .w-a{margin:0;text-align:right}
.w-note{text-align:right;margin-right:14px}
.w-av{width:46px;height:46px;flex:0 0 46px}

.w-av svg{width:100%;height:100%;display:block}
.mseg{margin-top:14px}
.mseg+.seg{margin-top:8px}
.mseg button[data-m="quick"]{flex:1.5}
.mseg button.on{background:#3a7f8f}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rerun{flex:0 0 68px;width:68px;height:68px;border-radius:50%;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--cool-ac);background:var(--cool-bg);color:var(--cool-fg);font:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.18)}
.rerun .ri{font-size:1.6rem;line-height:1}
.rerun .rl{font-size:.85rem;font-weight:700;letter-spacing:.02em;line-height:1;margin-top:2px}
.rerun.on{background:var(--cool-fg);border-color:var(--cool-fg);color:var(--cool-bg)}
.today.rep .gen,.today.rep .rst,.today.rep #seg,.today.rep .ldinfo,.today.rep .exs button{display:none}
:root{--ink:#27365f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#cdd8ff}}
.w-q{color:var(--ink);font-weight:600;font-size:1.85rem;letter-spacing:.3px;word-spacing:3px;line-height:1.25;text-shadow:0 0 .7px currentColor}
.w-q span{display:inline-block;transform-origin:50% 80%}
.w-av{width:56px;height:56px;flex:0 0 56px}
.phw{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden}
.phb,.ph{position:absolute;inset:0;background:currentColor}
.phb{opacity:.16}
.ph{opacity:.55;-webkit-mask-size:cover;mask-size:cover;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
body.pbreak{background:#3d6b8c;color:#fff}
main{position:relative;z-index:1}
.eseg{margin-top:8px}
.eseg button,.pk-f button{font-size:.8rem;padding:0 2px}
.eseg button.on,.pk-f button.on{background:#3a7f8f}
.mseg button[data-m="custom"]{flex:1.15}
.mseg button{font-size:.9rem;padding:0 4px}
.today:not(.cust) #cv,.today:not(.cust) #pick-open{display:none}
.pickbtn{display:block;width:100%;margin-top:10px;height:48px;border-radius:14px;border:1.5px solid var(--main-ac);background:var(--main-bg);color:var(--main-fg);font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.45}
.pk-h{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.pk-back{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.pk-t{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.9rem}
.pkr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--rowbg);border:1.5px solid transparent;border-radius:14px;padding:6px 12px 6px 8px;margin-bottom:6px;color:var(--fg);font:inherit;cursor:pointer}
.pkr svg{flex:0 0 60px;width:60px;height:36px;stroke:currentColor;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.pkn{flex:1;min-width:0}
.pkn b{display:block;font-weight:600}
.pkn small{color:var(--muted)}
.pkc{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-weight:700}
.pkr.sel{background:var(--main-bg);border-color:var(--main-ac)}
.pkr.sel .pkc{background:var(--main-ac);border-color:var(--main-ac);color:#fff}
.pk-bar{position:sticky;bottom:0;padding:10px 0 4px}
.vid{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:600;text-decoration:none;color:var(--cool-fg);border:1.5px solid var(--cool-ac);border-radius:14px;padding:3px 10px;background:var(--cool-bg)}
.blk .vid{color:var(--bf);border-color:var(--ba);background:var(--rowbg)}
.vidw{display:none;text-align:center;margin:0 0 6px}
.hasfig .vidw{display:block}
#run .vid{color:#fff;border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.16);font-size:.95rem;padding:6px 16px;margin-top:0}
.sportrow{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:6px 2px 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
.sportrow::-webkit-scrollbar{display:none}
.sportrow button{flex:0 0 auto;height:40px;padding:0 15px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:600;font-size:.92rem;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sportrow button.on{background:#3a7f8f;border-color:#3a7f8f;color:#fff}
.hdr{align-items:flex-start}
.cats{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0;padding-top:2px}
.cat{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cat .cl{font-weight:700;font-size:.93rem;line-height:1.15}
.cat .cv{font-size:.72rem;color:var(--muted);line-height:1.15}
.cat.open{background:#3a7f8f;border-color:#3a7f8f;color:#fff}
.cat.open .cv{color:rgba(255,255,255,.85)}
.panel{display:none;background:var(--card);border-radius:16px;padding:12px;margin:10px 0 4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel.open{display:block}
.ptip{font-size:.85rem;color:var(--muted);margin:0 0 10px;line-height:1.35}
.panel .seg,.panel .mseg,.panel .eseg{margin-top:0;box-shadow:none;background:var(--g2)}
.panel .gen{background:var(--g2);box-shadow:none;margin-top:8px}
.panel .gen:first-of-type{margin-top:0}
.panel .rst{margin-top:6px}
.panel .ldinfo{margin:8px 2px 0}
.panel .sportrow{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding:0}
.bubble{position:fixed;z-index:60;max-width:250px;background:#2a2f36;color:#fff;font-size:.82rem;line-height:1.35;padding:8px 11px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none;display:none}
/* Timer */
#run{flex:1;display:flex;flex-direction:column;text-align:center}
.phase{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(1.9rem,9vw,2.9rem);margin-top:14px;line-height:1.1;padding:0 8px}
.round{opacity:.85;font-size:1.15rem;margin-top:4px}
.time{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(7rem,38vw,13rem);line-height:1;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:12px;margin-bottom:8px}
.ctrl button{flex:1;height:64px;border-radius:16px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;cursor:pointer}
.ctrl button.main{background:#fff;color:#1c1b19;border-color:#fff}
button:focus-visible{outline:3px solid currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<main>

  <section id="setup" class="hidden">
    <div class="hdr"><div class="cats" id="cats" role="group" aria-label="Inställningar"><button type="button" class="cat" data-c="pass" data-tip="Välj mellan dagens pass, ett snabbpass på 5 minuter eller ett eget pass där du väljer övningarna själv."><span class="cl">Pass</span><span class="cv" id="cs-pass"></span></button><button type="button" class="cat" data-c="eq" data-tip="Välj vilken utrustning du vill träna styrka med: egen kropp, gummiband, hantlar eller kettlebell."><span class="cl">Utrustning</span><span class="cv" id="cs-eq"></span></button><button type="button" class="cat" data-c="sp" data-tip="Pass som är extra bra för löpning, fotboll, längdskidåkning, crossfit eller padel."><span class="cl">Sport</span><span class="cv" id="cs-sp"></span></button><button type="button" class="cat" data-c="load" data-tip="Hur tungt passet ska vara. Lätt, medel eller hårt styr övningarnas svårighet samt arbets- och vilotid."><span class="cl">Belastning</span><span class="cv" id="cs-load"></span></button><button type="button" class="cat" data-c="time" data-tip="Justera hur länge du kör och vilar, hur lång paus du tar mellan varven och hur många varv du kör."><span class="cl">Tider</span><span class="cv" id="cs-time"></span></button></div><button class="rerun" id="rerun" type="button"></button></div>
    <div class="today">
    <div id="panels">
      <div class="panel" id="pn-pass" data-c="pass"><p class="ptip"></p>
        <div class="seg mseg" id="mseg" role="group" aria-label="Välj pass"><button type="button" data-m="today">Idag</button><button type="button" data-m="quick">Snabbpass 5 min</button><button type="button" data-m="custom">Eget pass</button></div></div>
      <div class="panel" id="pn-eq" data-c="eq"><p class="ptip"></p>
        <div class="seg eseg" id="eseg" role="group" aria-label="Utrustning"><button type="button" data-e="body">Kropp</button><button type="button" data-e="band">Gummiband</button><button type="button" data-e="db">Hantlar</button><button type="button" data-e="kb">Kettlebell</button></div></div>
      <div class="panel" id="pn-sp" data-c="sp"><p class="ptip"></p>
        <div class="sportrow" id="sport" role="group" aria-label="Sportpass"><button type="button" data-sp="run">Löpning</button><button type="button" data-sp="foot">Fotboll</button><button type="button" data-sp="ski">Längdskidor</button><button type="button" data-sp="cf">Crossfit</button><button type="button" data-sp="pad">Padel</button></div></div>
      <div class="panel" id="pn-load" data-c="load"><p class="ptip"></p>
        <div class="seg" id="seg" role="group" aria-label="Belastning"><button type="button" data-l="0">Lätt</button><button type="button" data-l="1">Medel</button><button type="button" data-l="2">Hårt</button></div>
        <div class="ldinfo" id="ld-sub"></div></div>
      <div class="panel" id="pn-time" data-c="time"><p class="ptip"></p>
        <div class="gen"><div><b>Tid per övning</b><small id="g-sub"></small></div><div class="step"><button id="g-m" aria-label="Kortare tid för alla">−</button><span class="val" id="g-v"></span><button id="g-p" aria-label="Längre tid för alla">+</button></div></div>
        <div class="gen"><div><b>Vilotid</b><small id="g2-sub"></small></div><div class="step"><button id="g2-m" aria-label="Kortare vila för alla">−</button><span class="val" id="g2-v"></span><button id="g2-p" aria-label="Längre vila för alla">+</button></div></div>
        <div class="gen"><div><b>Paus mellan varv</b><small>Längre vila mellan varven</small></div><div class="step"><button id="g3-m" aria-label="Kortare paus mellan varv">−</button><span class="val" id="g3-v"></span><button id="g3-p" aria-label="Längre paus mellan varv">+</button></div></div>
        <div class="gen" id="cv"><div><b>Antal varv</b><small>Hur många gånger du kör igenom övningarna</small></div><div class="step"><button id="g4-m" aria-label="Färre varv">−</button><span class="val" id="g4-v"></span><button id="g4-p" aria-label="Fler varv">+</button></div></div>
        <button class="rst" id="g-r" type="button">Återställ till standard</button></div>
    </div>
    <div class="th" id="t-title"></div><div class="tm" id="t-meta"></div>
    <div class="bar" id="bar"></div>
    <div class="leg"><span class="warm">Uppvärmning</span><span class="main">Träning</span><span class="cool">Nedvarvning</span></div>
    <button class="go" id="start-today">Starta dagens pass</button>
    <button class="pickbtn" id="pick-open" type="button">Välj övningar ›</button>
    <p class="hint">Tryck på en övning för att börja där</p><div id="t-list"></div></div>
  </section>

  <section id="picker" class="hidden">
    <div class="pk-h"><button class="pk-back" id="pk-back" type="button">‹ Tillbaka</button><div class="pk-t">Välj övningar</div></div>
    <div class="seg pk-f" id="pk-f" role="group" aria-label="Filtrera på utrustning"><button type="button" data-f="all">Alla</button><button type="button" data-f="body">Kropp</button><button type="button" data-f="band">Band</button><button type="button" data-f="db">Hantlar</button><button type="button" data-f="kb">Kettlebell</button></div>
    <div id="pk-list"></div>
    <div class="pk-bar"><button class="go" id="pk-done" type="button">Klar</button></div>
  </section>
  <section id="run" class="hidden" aria-live="off">
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="phase" id="phase"></div>
    <div class="round" id="round"></div>
    <div class="nextbox" id="nextbox"><small id="nx-l"></small><b id="nx-n"></b></div>
    <svg id="fig" viewBox="0 0 200 120" aria-hidden="true"><line x1="10" y1="109" x2="190" y2="109" opacity=".4" stroke-width="3"/><path id="gh1" class="gh"/><path id="gh2" class="gh"/><polyline id="f-arm2" opacity=".5"/><polyline id="f-l2" opacity=".55"/><polyline id="f-l1"/><path id="f-tor"/><polyline id="f-arm"/><circle id="f-hd" r="8"/><g id="f-eq"></g><text id="f-lab" x="8" y="14"></text></svg>
    <div class="reps" id="reps"></div>
    <p class="tip" id="tip"></p>
    <div class="vidw"><a class="vid" id="vid" target="_blank" rel="noopener noreferrer">▶ Se video</a></div>
    <div class="time" id="time" role="timer">0:00</div>
    <p class="pepp" id="pepp"></p>
    <div class="ctrl skip" id="skip">
      <button id="prev" aria-label="Föregående övning">‹ Föregående</button>
      <button id="next" aria-label="Nästa övning">Nästa ›</button>
    </div>
    <div class="ctrl">
      <button id="pause" class="main">Pausa</button>
      <button id="stop">Avsluta</button>
    </div>
    <p class="awake" id="awake"></p>
    <button class="tickbtn" id="tickbtn" type="button"></button>
  </section>
</main>

<script>
(function(){
  var cfg={work:30,rest:15,rounds:8};
  try{var s=JSON.parse(localStorage.getItem('intervall-cfg'));if(s&&s.work&&s.rest&&s.rounds)cfg=s}catch(e){}
  var $=function(i){return document.getElementById(i)};
  var segs=[],idx=0,remMs=0,endAt=0,running=false,timerId=null,lastBeep=-1,ac=null,lock=null;

  function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s}
  function fmtLong(sec){var m=Math.floor(sec/60),s=sec%60;return m?m+' min'+(s?' '+s+' s':''):s+' s'}

  function beep(freq,dur){
    if(!ac)return;
    try{
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(.0001,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.5,ac.currentTime+.01);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
      o.connect(g);g.connect(ac.destination);
      o.start();o.stop(ac.currentTime+dur+.02);
    }catch(e){}
    if(navigator.vibrate)try{navigator.vibrate(dur>.3?250:60)}catch(e){}
  }

  var WARM=['Armcirklar','Höftcirklar','Marsch med höga knän','Katt och ko'],COOL=['Sträck framsida lår','Barnets ställning'];
  var POOL=[
    [['Knäböj','Utfall bakåt'],['Sumo-knäböj med paus','Utfall framåt'],['Hoppknäböj','Hoppande utfall']],
    [['Armhävningar på knä','Breda armhävningar på knä'],['Armhävningar','Breda armhävningar'],['Diamantarmhävningar','Långsamma armhävningar']],
    [['Glutebrygga','Good morning'],['Glutebrygga med marsch','Glutebrygga med paus'],['Enbens glutebrygga','Enbens rumänsk marklyft']],
    [['Superman','Omvänd snöängel'],['Superman med paus','Omvänd snöängel med paus'],['Y-T-W liggande','Superman med pulsar']],
    [['Planka','Fågelhunden'],['Sidoplanka','Cykelcrunch'],['Planka med axelklapp','Benhöjningar liggande']],
    [['Jumping jacks','Höga knän'],['Bergsklättrare','Skridskohopp'],['Burpees','Snabba bergsklättrare']]
  ];
  [[['Knäböj med armlyft','Långsam knäböj'],['Knäböj med paus','Gående utfall'],['Hoppknäböj med paus','Utfall med knälyft']],
   [['Smala armhävningar på knä','Långsamma armhävningar på knä'],['Armhävningar med paus','Smala armhävningar'],['Armhävningar med lång paus','Explosiva armhävningar']],
   [['Glutebrygga med knän isär','Långsam good morning'],['Glutebrygga på tå','Good morning med paus'],['Enbens glutebrygga med paus','Enbens good morning']],
   [['Simning','Bakre armlyft'],['Superman med armar vid sidan','Liggande W-lyft'],['Superman med långa pauser','Superman-roddar']],
   [['Planka på knä','Dead bug'],['Fågelhunden med paus','Liggande knälyft'],['Lång planka','Sidoplanka med höftlyft']],
   [['Hälsparkar','Sidosteg'],['Korsande bergsklättrare','Höga knän med snabba armar'],['Halvburpees','Plankhopp']]
  ].forEach(function(s,i){s.forEach(function(a,l){POOL[i][l]=POOL[i][l].concat(a)})});
  var CP=[['Sträck framsida lår','Utfallssträck','Djup hukande ställning'],['Barnets ställning','Lugn katt och ko','Hängande framåtfällning'],['Sidosträck','Sträck armarna upp','Nackstretch']];
  var MODE='today',SNAP=false;
  var WP=[['Armcirklar','Höftcirklar','Lugn framåtfällning'],['Marsch med höga knän','Lätta jumping jacks','Jogg på stället','Sidosteg med armsvingar'],['Lugna knäböj','Lugna utfall','Lätta glutebryggor'],['Katt och ko','Lätt fågelhund']];
  function today(){
    var n=new Date(),dn=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5);
    if(MODE==='yest')dn-=1;
    var w=Math.max(0,Math.floor((dn-Math.floor(Date.UTC(2026,9,19)/864e5))/7));
    var ld=cfg.load||0,lv=ld,work=Math.min(50,[30,40,45][ld]+5*Math.min(2,Math.floor(w/2)));
    WARM=WP.map(function(a,i){return a[(dn+i)%a.length]});
    COOL=CP.map(function(a,i){return a[(dn+i)%a.length]});
    initCat();
    var ex;
    if(MODE==='custom')ex=(cfg.custom||[]).filter(function(x){return CATX[x]});
    else if(cfg.sport&&SPORT[cfg.sport])ex=SPORT[cfg.sport].map(function(o,i){return o[(dn+i)%o.length]});
    else if(cfg.equip&&cfg.equip!=='body')ex=EQP[cfg.equip].map(function(o,i){return o[(dn+i)%o.length]});
    else ex=POOL.map(function(p,i){var o=p[lv];return o[(dn+i)%o.length]});
    if(MODE==='quick'){var sk=[dn%6,(dn+3)%6];ex=ex.filter(function(x,i){return sk.indexOf(i)<0});WARM=WARM.slice(0,2);COOL=COOL.slice(0,1);work=[40,45,50][ld]}
    return {w:w,lv:lv,work:work,rest:60-work,ex:ex,dn:dn};
  }
  function frozenRest(x){var j=-1;segs.forEach(function(q,k){if(q.t==='work'&&q.n===x)j=k});return segs[j+1]&&segs[j+1].t==='rest'?segs[j+1].d:0}
  function thumb(x){
    var ty=MAP[x],fr=ty&&FR[ty];
    if(!fr)return '<svg viewBox="0 0 200 120"></svg>';
    var p=ex(fr[Math.min(1,fr.length-1)]),m=p[19]>.5,pt=function(a){return a.join(' ')};
    return '<svg viewBox="0 0 200 120" aria-hidden="true"><line x1="10" y1="109" x2="190" y2="109" opacity=".35" stroke-width="5"/><path d="'+tpath(p)+'" stroke-width="12"/><polyline points="'+pt([p[2],p[3],p[6],p[7],p[8],p[9]])+'"/>'+(p[19]>1.5?'<polyline points="'+pt([p[2],p[3],p[20],p[21],p[22],p[23]])+'"/>':m?'<polyline points="'+pt([p[2],p[3],2*p[2]-p[6],p[7],2*p[2]-p[8],p[9]])+'"/>':'')+'<polyline points="'+pt([p[4],p[5],p[10],p[11],p[12],p[13]])+'"/><polyline points="'+pt([p[4],p[5],p[14],p[15],p[16],p[17]])+'" opacity=".55"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="currentColor"/></svg>';
  }
  function renderToday(){
    var T=today();
    var dd=new Date(Date.now()-(MODE==='yest'?864e5:0)).toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});
    $('t-title').textContent=MODE==='quick'?'Snabbpass · 5 min':MODE==='custom'?'Eget pass':MODE==='yest'?'Igår · '+dd:(cfg.sport?SPN[cfg.sport]+' · ':'')+dd;
    $('t-meta').textContent='15 min · vecka '+(T.w+1)+' · nivå '+(T.lv+1)+' · '+T.work+' s arbete, '+T.rest+' s vila, 2 varv';
    buildToday();
    if(MODE==='today'){
      cfg.hist=cfg.hist||{};
      cfg.hist[String(T.dn)]=JSON.parse(JSON.stringify(segs));
      Object.keys(cfg.hist).forEach(function(k){if(Number(k)<T.dn-3)delete cfg.hist[k]});
      saveCfg();
    }
    var WL=segs.filter(function(z){return z.t==='warm'}).map(function(z){return z.n}),CL=segs.filter(function(z){return z.t==='cool'}).map(function(z){return z.n}),ML=[];
    segs.forEach(function(z){if(z.t==='work'&&ML.indexOf(z.n)<0)ML.push(z.n)});
    document.querySelector('.today').classList.toggle('rep',MODE==='yest');
    document.querySelector('.today').classList.toggle('cust',MODE==='custom');
    document.querySelector('.today').classList.toggle('sp',!!cfg.sport&&MODE!=='custom');
    document.querySelectorAll('#sport button').forEach(function(b){b.classList.toggle('on',b.dataset.sp===cfg.sport)});
    $('start-today').disabled=(MODE==='custom'&&!T.ex.length);
    document.querySelectorAll('#eseg button').forEach(function(b){b.classList.toggle('on',b.dataset.e===(cfg.equip||'body')&&!cfg.sport)});
    $('g4-v').textContent=(cfg.cvarv||1);
    var modeN={today:'Idag',yest:'Igår',quick:'Snabbpass',custom:'Eget pass'};
    $('cs-pass').textContent=modeN[MODE];
    $('cs-eq').textContent=cfg.sport?'Följer sport':EQS[cfg.equip||'body'];
    $('cs-sp').textContent=cfg.sport?SPN[cfg.sport]:'Ingen';
    $('cs-load').textContent=['Lätt','Medel','Hårt'][cfg.load||0];
    $('cs-time').textContent=(cfg.gen||cfg.rgen!=null||(cfg.rb&&cfg.rb!==60)||Object.keys(cfg.ov||{}).length||Object.keys(cfg.rov||{}).length)?'Egna':'Standard';
    $('pick-open').textContent=(MODE==='custom'&&T.ex.length)?'Ändra valda övningar ('+T.ex.length+') ›':'Välj övningar ›';
    var tot=segs.reduce(function(a,s){return a+(s.t==='prep'?0:s.d)},0);
    $('t-meta').textContent=MODE==='yest'?('Totalt '+fmtLong(tot)+' · '+(SNAP?'exakt som igår':'återskapat med standardtider')):('Totalt '+fmtLong(tot)+' · '+['Lätt','Medel','Hårt'][cfg.load||0]+' · vecka '+(T.w+1)+(MODE==='custom'?'':(cfg.sport?' · '+SPN[cfg.sport]:((cfg.equip&&cfg.equip!=='body')?' · '+EQN[cfg.equip]:''))));
    document.querySelectorAll('#mseg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===MODE)});
    $('start-today').textContent=MODE==='yest'?'Starta gårdagens pass':MODE==='quick'?'Starta snabbpasset':MODE==='custom'?'Starta eget pass':'Starta dagens pass';
    $('rerun').innerHTML=MODE==='yest'?'<span class="ri">←</span><span class="rl">Idag</span>':'<span class="ri">↺</span><span class="rl">Igår</span>';
    $('rerun').setAttribute('aria-label',MODE==='yest'?'Tillbaka till dagens pass':'Repris på gårdagens pass');
    $('rerun').setAttribute('title',MODE==='yest'?'Tillbaka till dagens pass':'Repris på gårdagens pass');
    $('rerun').classList.toggle('on',MODE==='yest');
    $('g-v').textContent=cfg.gen?cfg.gen+' s':'Auto';
    document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',Number(b.dataset.l)===(cfg.load||0))});
    $('ld-sub').textContent=['Lättaste varianterna','Medelsvåra varianter','Svåraste varianterna'][cfg.load||0]+' · '+T.work+' s arbete, '+T.rest+' s vila';
    $('g2-v').textContent=cfg.rgen!=null?cfg.rgen+' s':'Auto';
    $('g3-v').textContent=(cfg.rb||60)+' s';
    $('g2-sub').textContent=cfg.rgen!=null?'Gäller alla övningar':'Standard för belastningen ('+T.rest+' s)';
    $('g-sub').textContent=cfg.gen?'Gäller alla övningar':'Standard för belastningen';
    var box=$('t-list');box.innerHTML='';
    var cur=null;
    var grp=function(n,t,c){cur=document.createElement('section');cur.className='blk '+c;var h=document.createElement('div');h.className='bh';var a=document.createElement('span'),m=document.createElement('small');a.textContent=n;m.textContent=t;h.appendChild(a);h.appendChild(m);cur.appendChild(h);box.appendChild(cur)};
    var row=function(t,x,info){
      var i=segs.findIndex(function(s){return s.t===t&&s.n===x});
      var b=document.createElement('div');b.className='exr';
      b.innerHTML='<button type="button" class="exth">'+thumb(x)+'</button><div class="exc"><button type="button" class="exn"></button><div class="exs"><button type="button" class="m" aria-label="Kortare tid">−</button><span class="ev"></span><button type="button" class="p" aria-label="Längre tid">+</button><small class="exi"></small></div>'+(info==='rest'?'<div class="exs rs"><small class="exl">Vila</small><button type="button" class="rm" aria-label="Kortare vila">−</button><span class="ev rv"></span><button type="button" class="rp" aria-label="Längre vila">+</button></div>':'')+'<a class="vid vs" target="_blank" rel="noopener noreferrer">▶ Se video</a></div>';
      b.querySelector('.vid').href=vidUrl(x);
      var sg=segs[i],ev=b.querySelector('.ev');
      b.querySelector('.exn').textContent=x;
      ev.textContent=sg.d+' s';
      if(cfg.ov[x])ev.classList.add('custom');
      b.querySelector('.exi').textContent=info==='rest'?'':info;
      if(info==='rest'){
        var rd0=SNAP?frozenRest(x):rst(x,T.rest),rv=b.querySelector('.rv');
        rv.textContent=rd0+' s';
        if(cfg.rov[x]!==undefined)rv.classList.add('custom');
        var chr=function(d){cfg.rov[x]=Math.min(120,Math.max(0,rd0+d));saveCfg();renderToday()};
        b.querySelector('.rm').addEventListener('click',function(){chr(-5)});
        b.querySelector('.rp').addEventListener('click',function(){chr(5)});
      }
      var go=function(){start('today',i)};
      b.querySelector('.exn').addEventListener('click',go);
      b.querySelector('.exth').addEventListener('click',go);
      var chg=function(d){cfg.ov[x]=Math.min(120,Math.max(10,sg.d+d));saveCfg();renderToday()};

  });
  TIPS['Katt och ko']='Svanka: magen mot golvet och blicken framåt. Runda: hakan mot bröstet. Andas med rörelsen.';
  var LAB={squat:['Sänk','Res dig'],lunge:['Sänk','Tryck upp'],push:['Sänk','Pressa upp'],pushk:['Sänk','Pressa upp'],bridge:['Lyft höfterna','Sänk'],bridge1:['Lyft höfterna','Sänk'],hinge:['Fäll framåt','Res dig'],hinge1:['Fäll framåt','Res dig'],superman:['Lyft','Sänk'],plank:['Håll kroppen rak','Håll kroppen rak'],sidep:['Lyft höften','Sänk'],bird:['Sträck ut','Tillbaka'],legraise:['Lyft benen','Sänk benen'],bike:['Växla ben','Växla ben'],climber:['Dra knät','Byt ben'],jack:['Hoppa ut','Hoppa ihop'],skate:['Hoppa åt sidan','Och tillbaka'],highknee:['Knä upp','Ner'],burpee:['Ner i planka','Hoppa upp'],armcircle:['Cirkla'],hipcircle:['Höfter åt sidan','Åt andra sidan'],cat:['Svanka','Runda ryggen'],quad:['Hälen mot rumpan','Släpp'],child:['Sitt bak mot hälarna','Tillbaka']};
  LAB.calf=['Upp på tå','Sänk'];LAB.latlunge=['Sänk åt sidan','Tryck tillbaka'];LAB.pole=['Dra ner','Upp'];LAB.row=['Dra armbågarna bakåt','Sänk'];LAB.curl=['Böj armen','Sänk långsamt'];LAB.lateral=['Lyft armarna ut','Sänk'];LAB.press=['Pressa upp','Sänk'];LAB.frontraise=['Lyft framåt','Sänk'];LAB.swing=['Svinga upp','Tillbaka'];LAB.floorpress=['Pressa upp','Sänk'];LAB.armlift=['Lyft bröst och armar','Sänk'];LAB.deadbug=['Arm + motsatt ben','Arm + motsatt ben'];LAB.heelkick=['Häl mot rumpa','Byt ben'];LAB.sidebend=['Luta åt sidan','Tillbaka'];LAB.reach=['Sträck upp','Sänk långsamt'];LAB.neck=['Huvudet åt sidan','Åt andra sidan'];
  function tk(f){
    if(!ac||!tickOn)return;
    try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.07);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.09)}catch(e){}
  }
  function tkBtn(){$('tickbtn').textContent='Taktljud: '+(tickOn?'på':'av')}
  $('tickbtn').addEventListener('click',function(){
    tickOn=!tickOn;cfg.tick=tickOn;
    try{localStorage.setItem('intervall-cfg',JSON.stringify(cfg))}catch(e){}
    tkBtn();
    if(tickOn){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}tk(780)}
  });
  tkBtn();
  var raf=0;
  function stopFig(){cancelAnimationFrame(raf)}
  function showFig(sg){
    stopFig();
    EQNOW=EQM[sg.ill]||null;
    if(sg.ill)$('vid').href=vidUrl(sg.ill);
    var ty=sg.ill&&MAP[sg.ill],fr=ty&&FR[ty];
    var nb=sg.ill&&sg.dim;
    $('nextbox').style.display=nb?'block':'none';
    if(nb){$('nx-l').textContent=sg.t==='prep'?'Börjar med':'Nästa övning';$('nx-n').textContent=sg.ill}
    $('tip').textContent=(sg.ill&&TIPS[sg.ill])||'';
    $('run').classList.toggle('hasfig',!!fr);
    if(!fr)return;
    $('fig').classList.toggle('dim',!!sg.dim);
    $('gh1').setAttribute('d',LOOP[ty]?'':pth(ex(fr[0])));
    $('gh2').setAttribute('d',LOOP[ty]?'':pth(ex(fr[fr.length-1])));
    var n=fr.length,lp=!!LOOP[ty],D=DUR[ty]||900,t0=performance.now(),last=t0,el=0,tp=TEMPOX[sg.ill]||TEMPO[ty]||[1000,200,1000,200],cyc=tp[0]+tp[1]+tp[2]+tp[3],ph=-1,hold=HOLD[ty],prev=!!sg.dim,lb=LAB[ty];
    $('f-lab').textContent='';
    $('reps').textContent=prev?'Så här gör du – titta på figuren':(hold||'');
    (function f(now){
      raf=requestAnimationFrame(f);now=performance.now();if(running)el+=Math.max(0,now-last);last=now;
      var d=el/D,pos,np=-1;
      if(lp){pos=d%n;np=Math.floor(pos)===0?0:-1}
      else{
        var t=el%cyc,s;
        if(t<tp[0]){np=0;s=t/tp[0]}
        else if(t<tp[0]+tp[1]){np=1;s=1}
        else if(t<tp[0]+tp[1]+tp[2]){np=2;s=1-(t-tp[0]-tp[1])/tp[2]}
        else{np=3;s=0}
        pos=Math.max(0,s*(n-1));
      }
      if(np!==ph){
        ph=np;
        if(running&&!prev&&(np===0||np===2))tk(np?780:520);
        if(!prev&&lb){
          var L=null;
          if(np===0)L=lb[0];else if(np===2)L=lb[1];
          else if((np===1&&tp[1]>=800)||(np===3&&tp[3]>=800))L='Håll';
          if(L!==null&&L!==undefined)$('f-lab').textContent=L;
        }
      }
      if(!prev&&!hold&&running){var rl=lp?D*n:cyc;$('reps').textContent='Rep '+(Math.floor(el/rl)+1)+' · ca '+(Math.round(rl/100)/10).toString().replace('.',',')+' s per rep'}
      var i=Math.max(0,Math.min(Math.floor(pos),n-1)),j=lp?(i+1)%n:Math.min(i+1,n-1);
      var u=(1-Math.cos(Math.PI*(pos-i)))/2,a=ex(fr[i]),b=ex(fr[j]);
      draw(a.map(function(v,q){return v+(b[q]-v)*u}));
    })(t0);
  }
  function buildToday(){
    var T=today(),q=MODE==='quick',RN=q?1:(MODE==='custom'?(cfg.cvarv||1):2),N=T.ex.length,wd=q?20:30;
    SNAP=false;
    if(MODE==='yest'){
      var hs=cfg.hist&&cfg.hist[String(T.dn)];
      if(hs){
        segs=JSON.parse(JSON.stringify(hs));SNAP=true;
        WARM=segs.filter(function(z){return z.t==='warm'}).map(function(z){return z.n});
        COOL=segs.filter(function(z){return z.t==='cool'}).map(function(z){return z.n});
        return;
      }
    }
    segs=[{t:'prep',d:5,n:'Gör dig redo',sub:'Uppvärmning först',ill:WARM[0],dim:true}];
    WARM.forEach(function(x,i){segs.push({t:'warm',d:dur(x,wd),n:x,sub:'Uppvärmning '+(i+1)+' av '+WARM.length,ill:x})});
    if(!q)segs.push({t:'pbreak',g:'work',d:30,n:'Gör dig redo för träning',sub:'Uppvärmningen är klar',ill:T.ex[0],dim:true});
    for(var r=1;r<=RN;r++)T.ex.forEach(function(x,i){
      var nx=i<N-1?T.ex[i+1]:(r<RN?T.ex[0]:COOL[0]);
      var vp=RN>1?'Varv '+r+' av '+RN+' · ':'';
      segs.push({t:'work',d:dur(x,T.work),n:x,sub:(RN>1?vp+'övning ':'Övning ')+(i+1)+' av '+N,ill:x});
      var rd=rst(x,T.rest);
      if(i===N-1&&r<RN){var left=RN-r;segs.push({t:'rbreak',d:(MODE==='yest'?60:(cfg.rb||60)),n:'Bra jobbat!',sub:(left===1?'Ett varv kvar – kom igen!':left+' varv kvar – kom igen!'),ill:T.ex[0],dim:true})}
      else if(rd>0&&!(r===RN&&i===N-1&&!q))segs.push({t:'rest',d:rd,n:'Vila',sub:vp+(i+1)+' av '+N+' klara',ill:nx,dim:true});
    });
    if(!q)segs.push({t:'pbreak',g:'cool',d:30,n:'Gör dig redo för nedvarvning',sub:'Träningen är klar',ill:COOL[0],dim:true});
    COOL.forEach(function(x,i){segs.push({t:'cool',d:dur(x,20),n:x,sub:'Nedvarvning '+(i+1)+' av '+COOL.length,ill:x})});
    segs.push({t:'done',d:0,n:'Klart!',sub:'Passet är klart – bra jobbat!'});
  }

  function build(mode){
    buildToday();
  }
  var names={prep:'Gör dig redo',work:'Kör!',rest:'Vila',done:'Klart!'};

  function enter(i,silent){
    idx=i;var sg=segs[i];
    document.body.className=sg.t;
    $('phase').textContent=sg.n||names[sg.t];showFig(sg);$('skip').classList.toggle('hidden',sg.t==='done');if(sg.t==='rbreak'||sg.t==='done')confetti();
    $('round').textContent=sg.sub||(sg.t==='prep'?'Första varvet startar snart':sg.t==='done'?cfg.rounds+' varv avklarade':'Varv '+sg.r+' av '+cfg.rounds);
    lastBeep=-1;
    if(sg.t==='done'){
      running=false;clearInterval(timerId);releaseLock();
      $('time').textContent='✓';
      var PM=['Starkt jobbat! Du gjorde det igen – kroppen tackar dig.','Du kom, du körde, du klarade det. Bra gjort!','Ett riktigt bra pass. Ta en klunk vatten och var stolt!','Varje pass räknas, och idag klarade du det. Grymt!','Imorgon blir det ännu lättare att komma igång. Du är på rätt väg!'];
      $('pepp').textContent=PM[Math.floor(Math.random()*PM.length)];
      $('pause').textContent='Tillbaka';
      beep(660,.15);setTimeout(function(){beep(880,.15)},200);setTimeout(function(){beep(1100,.4)},400);
      return;
    }
    remMs=sg.d*1000;endAt=Date.now()+remMs;
    $('time').textContent=fmt(sg.d);
    if(!silent){if(sg.t==='work')beep(1000,.5);else if(sg.t==='rest'||sg.t==='pbreak')beep(520,.4);else if(sg.t==='warm'||sg.t==='cool')beep(700,.3);else if(sg.t==='rbreak'){beep(660,.15);setTimeout(function(){beep(880,.15)},180);setTimeout(function(){beep(1100,.35)},360)}}
  }

  function tick(){
    if(!running)return;
    var rem=endAt-Date.now();
    if(rem<=0){enter(idx+1);return}
    var sec=Math.ceil(rem/1000);
    $('time').textContent=fmt(sec);
    if(sec<=3&&sec!==lastBeep){lastBeep=sec;beep(760,.12)}
  }

  function getLock(){
    want=true;wl();
  }
  var want=false,vid=null,vt=null;
  function setAwake(s){
    var m={wl:'Skärmen hålls tänd',fb:'Skärmen hålls tänd (reservläge)',none:'Kunde inte hålla skärmen tänd. Ställ in längre skärmlås på telefonen.',off:''};
    $('awake').textContent=m[s]||'';
  }
  function fbStop(){
    clearInterval(vt);
    if(vid){try{vid.pause();vid.srcObject=null;vid.remove()}catch(e){}vid=null}
  }
  function fbStart(){
    if(vid)return;
    try{
      var c=document.createElement('canvas'),g,f=0,v=document.createElement('video');
      c.width=c.height=16;g=c.getContext('2d');
      v.setAttribute('playsinline','');v.muted=true;
      v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:.02;pointer-events:none';
      v.srcObject=c.captureStream(5);
      document.body.appendChild(v);vid=v;
      vt=setInterval(function(){f=1-f;g.fillStyle=f?'#000':'#111';g.fillRect(0,0,16,16)},200);
      v.play().then(function(){if(want&&!lock)setAwake('fb')}).catch(function(){setAwake('none')});
    }catch(e){setAwake('none')}
  }
  function wl(){
    if(!want||lock)return;
    try{
      if(navigator.wakeLock){
        navigator.wakeLock.request('screen').then(function(l){
          if(!want){l.release();return}
          lock=l;fbStop();setAwake('wl');
          l.addEventListener('release',function(){lock=null;if(want&&!document.hidden)wl()});
        }).catch(function(){fbStart()});
        return;
      }
    }catch(e){}
    fbStart();
  }
  function releaseLock(){want=false;try{if(lock){lock.release();lock=null}}catch(e){}fbStop();setAwake('off')}

  function start(mode,from){
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){ac=null}
    build(mode);
    $('setup').classList.add('hidden');$('run').classList.remove('hidden');
    $('pause').textContent='Pausa';
    running=true;
    if(from>0){
      segs.splice(from,0,{t:'prep',d:5,n:'Gör dig redo',sub:'Börjar med '+segs[from].n,ill:segs[from].n,dim:true});
      enter(from,true);
    }else enter(0,true);
    clearInterval(timerId);timerId=setInterval(tick,100);
    getLock();
  }
  function toggle(){
    if(segs[idx]&&segs[idx].t==='done'){stop();return}
    if(running){
      running=false;remMs=endAt-Date.now();
      $('pause').textContent='Fortsätt';
    }else{
      running=true;endAt=Date.now()+remMs;
      $('pause').textContent='Pausa';getLock();
    }
  }
  $('vid').addEventListener('click',function(){if(running)toggle()});
  function stop(){
    running=false;clearInterval(timerId);releaseLock();
    document.body.className='';stopFig();
    $('run').classList.add('hidden');$('setup').classList.remove('hidden');
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&want)wl()});
  $('start-today').addEventListener('click',function(){start('today')});
  renderToday();
  function jump(dir){
    var ex=function(i){return segs[i].t!=='rest'&&segs[i].t!=='prep'&&segs[i].t!=='rbreak'&&segs[i].t!=='pbreak'};
    var i=idx+dir;
    while(i>=0&&i<segs.length&&!ex(i)&&segs[i].t!=='done')i+=dir;
    if(i<0||i>=segs.length)i=idx;
    enter(i,!running);
  }
  $('prev').addEventListener('click',function(){jump(-1)});
  $('next').addEventListener('click',function(){jump(1)});
  $('pause').addEventListener('click',toggle);
  $('stop').addEventListener('click',stop);
})();
