<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dagens pass</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f8a63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dagens pass">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f1ee; --fg:#1c1b19; --muted:#6b6862; --card:#fff; --line:#dcd8d1; --accent:#1c1b19; --accent-fg:#f3f1ee;
  --work:#c8321f; --rest:#1f6f8b; --prep:#8a6a00; --done:#2e7d4f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171614;--fg:#f1eee9;--muted:#9a958c;--card:#222018;--line:#38352e;--accent:#f1eee9;--accent-fg:#171614}
}
:root[data-theme="dark"]{--bg:#171614;--fg:#f1eee9;--muted:#9a958c;--card:#222018;--line:#38352e;--accent:#f1eee9;--accent-fg:#171614}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  transition:background .35s;
  -webkit-tap-highlight-color:transparent;
}
body.work{background:var(--work);color:#fff}
body.rest{background:var(--rest);color:#fff}
body.prep{background:var(--prep);color:#fff}
body.done{background:var(--done);color:#fff}
main{height:100%;display:flex;flex-direction:column;padding:20px;max-width:520px;margin:0 auto;overflow-y:auto}
h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2rem;margin:8px 0 20px}
.hidden{display:none!important}

/* Inställningar */
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1.6rem;line-height:1;cursor:pointer}
.step button:active{background:var(--line)}
.val{min-width:84px;text-align:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2rem}
.total{color:var(--muted);text-align:center;margin:8px 0 auto}
.go{margin-top:20px;width:100%;height:64px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.6rem;cursor:pointer}

body.warm{background:#6a4c93;color:#fff}
body.cool{background:#55606e;color:#fff}
.today{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:8px}
.th{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;text-transform:capitalize}
.tm{color:var(--muted);font-size:.95rem;margin:2px 0 10px}
#t-list{columns:2;margin:0;padding-left:20px;line-height:1.6}
h2.sub{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.4rem;margin:22px 0 10px}
#fig{display:none;width:100%;flex:1 1 0;min-height:0;stroke:currentColor;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.hasfig #fig{display:block}
#fig.dim{opacity:.55}
.hasfig .time{flex:0 0 auto;font-size:clamp(4.5rem,22vw,7.5rem);padding:4px 0 12px}
.skip{margin-bottom:12px}
.ctrl.skip button{height:48px;font-size:1.25rem}
.gh{opacity:.45;stroke-width:4;stroke-dasharray:.1 9}
#f-tor{stroke-width:10}
#f-hd{fill:currentColor}
.hasfig #fig{min-height:90px}
.tip{display:none;margin:0 6px 4px;min-height:4em;font-size:.98rem;line-height:1.35}
.hasfig .tip{display:block}
.awake{font-size:.8rem;opacity:.75;margin:6px 0 0;min-height:1.2em}
.reps{display:none;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.3rem;margin:2px 0 4px;min-height:1.4em}
.hasfig .reps{display:block}
.hasfig .tip{min-height:3.4em;font-size:.92rem}
.tickbtn{align-self:center;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:6px 14px;font:inherit;font-size:.85rem;margin-top:6px;cursor:pointer}
#f-lab{fill:currentColor;stroke:none;font:700 10px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.03em}
#t-list{columns:1;padding-left:0}
.grp{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.exr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 8px;margin-bottom:6px;font:inherit;cursor:pointer}
.exr:active{background:var(--line)}
.exr svg{flex:0 0 68px;width:68px;height:41px;stroke:currentColor;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.exr b{display:block;font-weight:600}
.exr small{color:var(--muted)}
.exr .go2{margin-left:auto;color:var(--muted);font-size:1.5rem}
.gen{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0 0}
.gen b{font-weight:600}
.gen small{display:block;color:var(--muted)}
.gen .val{min-width:64px;font-size:1.7rem}
.rst{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.85rem;padding:6px 0 0;cursor:pointer}
.exth{background:none;border:0;padding:0;color:inherit;cursor:pointer;flex:0 0 68px}
.exc{flex:1;min-width:0}
.exn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.exs{display:flex;align-items:center;gap:6px;margin-top:4px}
.exs button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1.2rem;line-height:1;cursor:pointer}
.exs button:active{background:var(--line)}
.ev{min-width:46px;text-align:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.25rem}
.ev.custom{text-decoration:underline}
.exi{color:var(--muted);margin-left:4px}
:root{--warm-bg:#fcefd8;--warm-ac:#e8a94d;--warm-fg:#8a5712;--main-bg:#e2f0e3;--main-ac:#6dbb7f;--main-fg:#2b6a3a;--cool-bg:#e3e8f8;--cool-ac:#8c9be0;--cool-fg:#3a4a92;--rowbg:rgba(255,255,255,.65);--g1:#fbf6ee;--g2:#eaf1ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warm-bg:#3a3022;--warm-ac:#d79a42;--warm-fg:#f0c37a;--main-bg:#223529;--main-ac:#5aa56d;--main-fg:#9fd6ab;--cool-bg:#262b42;--cool-ac:#7d8ddb;--cool-fg:#b3bff5;--rowbg:rgba(255,255,255,.07);--g1:#1c1a17;--g2:#161c1c}}
body{background:linear-gradient(170deg,var(--g1),var(--g2)) fixed}
body.warm{background:#a56a14}
body.cool{background:#4a5aa6}
h1{font-size:2.4rem;margin:6px 0 2px}
.today{background:none;border:0;padding:0;margin:0}
.th{font-family:'Barlow',system-ui,sans-serif;font-weight:600;font-size:1.05rem;color:var(--muted)}
.tm{margin:2px 0 0}
.bar{display:flex;gap:3px;height:10px;margin:14px 0 6px}
.bar i{border-radius:6px}
.bar .warm,.leg .warm::before{background:var(--warm-ac)}
.bar .main,.leg .main::before{background:var(--main-ac)}
.bar .cool,.leg .cool::before{background:var(--cool-ac)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.leg span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.go{background:linear-gradient(135deg,#3f8a63,#3a7f8f);color:#fff;height:68px;border-radius:20px;box-shadow:0 6px 18px rgba(58,127,143,.28)}
.gen{background:var(--card);border:0;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin:16px 0 0}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:16px 0 0}
.blk{--bb:var(--card);--ba:var(--line);--bf:var(--fg);background:var(--bb);border-left:6px solid var(--ba);border-radius:20px;padding:12px 12px 6px 10px;margin:12px 0}
.blk.warm{--bb:var(--warm-bg);--ba:var(--warm-ac);--bf:var(--warm-fg)}
.blk.main{--bb:var(--main-bg);--ba:var(--main-ac);--bf:var(--main-fg)}
.blk.cool{--bb:var(--cool-bg);--ba:var(--cool-ac);--bf:var(--cool-fg)}
.bh{display:flex;align-items:baseline;justify-content:space-between;color:var(--bf);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;padding:0 4px 8px}
.bh small{font-family:'Barlow',system-ui,sans-serif;font-weight:600;font-size:.85rem}
.blk .exr{background:var(--rowbg);border-color:transparent}
.blk .exr:active{background:var(--bb)}
.blk .exth svg{color:var(--bf)}
.blk .exs button{border-color:var(--ba);color:var(--bf)}
.blk .ev{color:var(--bf)}
.blk .exi{color:var(--bf);opacity:.8}
.gen+.gen{margin-top:8px}
.rs{margin-top:2px}
.exl{min-width:36px;opacity:.85}
.blk .exl{color:var(--bf)}
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.seg button{flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--fg);font:inherit;font-weight:600;font-size:1rem;cursor:pointer}
.seg button.on{color:#fff}
.seg button[data-l="0"].on{background:#3f8f64}
.seg button[data-l="1"].on{background:#b97a14}
.seg button[data-l="2"].on{background:#c04a3b}
.ldinfo{color:var(--muted);font-size:.9rem;margin:6px 2px 0;min-height:1.3em}
body.rbreak{background:#2a7f6f;color:#fff}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.pepp{display:none;text-align:center;font-size:1.3rem;font-weight:600;line-height:1.3;margin:0 10px 18px}
body.done .pepp{display:block;animation:fadein .9s 1.4s both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nextbox{display:none;margin:6px 8px 0;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.2)}
.nextbox small{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.nextbox b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2rem;line-height:1.1}
.hasfig #fig.dim{opacity:.85}
#welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:8px 4px}
#welcome.hidden{display:none}
.w-emoji{font-size:4.2rem;line-height:1;margin-bottom:6px;animation:flexy 1.6s ease-in-out infinite alternate}
@keyframes flexy{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.08)}}
.w-hi{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:3rem;line-height:1.05;margin:4px 0 10px}
.w-msg{font-size:1.2rem;line-height:1.4;margin:0 6px 16px}
.w-quote{background:none;border-radius:0;padding:6px 12px 8px;box-shadow:none;text-align:left;transform:rotate(-2.5deg);transform-origin:50% 50%}
main{overflow-x:hidden}
.w-qh{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.w-q{font-family:'Caveat','Bradley Hand','Segoe Script','Comic Sans MS',cursive;font-weight:500;font-size:1.75rem;font-style:normal;line-height:1.2;margin:0}
.w-a{color:var(--muted);margin:10px 0 0;font-size:.95rem}
.w-note{color:var(--muted);font-size:.78rem;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.w-emoji{animation:none}}
.w-by{display:flex;flex-direction:row-reverse;justify-content:flex-start;align-items:center;gap:12px;margin:8px 14px 0 0;color:var(--muted)}
.w-by .w-a{margin:0;text-align:right}
.w-note{text-align:right;margin-right:14px}
.w-av{width:46px;height:46px;flex:0 0 46px}

.w-av svg{width:100%;height:100%;display:block}
.mseg{margin-top:14px}
.mseg+.seg{margin-top:8px}
.mseg button[data-m="quick"]{flex:1.5}
.mseg button.on{background:#3a7f8f}
.hdr{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.rerun{flex:0 0 68px;width:68px;height:68px;border-radius:50%;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--cool-ac);background:var(--cool-bg);color:var(--cool-fg);font:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.18)}
.rerun .ri{font-size:1.6rem;line-height:1}
.rerun .rl{font-size:.85rem;font-weight:700;letter-spacing:.02em;line-height:1;margin-top:2px}
.rerun.on{background:var(--cool-fg);border-color:var(--cool-fg);color:var(--cool-bg)}
.today.rep .gen,.today.rep .rst,.today.rep #seg,.today.rep .ldinfo,.today.rep .exs button{display:none}
:root{--ink:#27365f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#cdd8ff}}
.w-q{color:var(--ink);font-weight:600;font-size:1.85rem;letter-spacing:.3px;word-spacing:3px;line-height:1.25;text-shadow:0 0 .7px currentColor}
.w-q span{display:inline-block;transform-origin:50% 80%}
.w-av{width:56px;height:56px;flex:0 0 56px}
.phw{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden}
.phb,.ph{position:absolute;inset:0;background:currentColor}
.phb{opacity:.16}
.ph{opacity:.55;-webkit-mask-size:cover;mask-size:cover;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
/* Timer */
#run{flex:1;display:flex;flex-direction:column;text-align:center}
.phase{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(1.9rem,9vw,2.9rem);margin-top:14px;line-height:1.1;padding:0 8px}
.round{opacity:.85;font-size:1.15rem;margin-top:4px}
.time{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(7rem,38vw,13rem);line-height:1;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:12px;margin-bottom:8px}
.ctrl button{flex:1;height:64px;border-radius:16px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;cursor:pointer}
.ctrl button.main{background:#fff;color:#1c1b19;border-color:#fff}
button:focus-visible{outline:3px solid currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<main>
  <section id="welcome">
    <div class="w-hi" id="w-hi"></div>
    <p class="w-msg" id="w-msg"></p>
    <div class="w-hero" role="img" aria-label="Solnedgång över havet"></div>
    <div class="w-quote"><p class="w-q" id="w-q"></p></div>
    <div class="w-by"><div class="w-av" id="w-av" aria-hidden="true"></div><p class="w-a" id="w-a"></p></div>
    <button class="go" id="w-go" type="button">Kom igång</button>
  </section>

  <section id="setup" class="hidden">
    <div class="hdr"><button class="rerun" id="rerun" type="button"></button></div>
    <div class="today"><div class="th" id="t-title"></div><div class="tm" id="t-meta"></div>
    <div class="bar" id="bar"></div>
    <div class="leg"><span class="warm">Uppvärmning</span><span class="main">Träning</span><span class="cool">Nedvarvning</span></div>
    <div class="seg mseg" id="mseg" role="group" aria-label="Välj pass"><button type="button" data-m="today">Idag</button><button type="button" data-m="quick">Snabbpass 5 min</button></div>
    <div class="seg" id="seg" role="group" aria-label="Belastning"><button type="button" data-l="0">Lätt</button><button type="button" data-l="1">Medel</button><button type="button" data-l="2">Hårt</button></div>
    <div class="ldinfo" id="ld-sub"></div>
    <button class="go" id="start-today">Starta dagens pass</button>
    <div class="gen"><div><b>Tid per övning</b><small id="g-sub"></small></div><div class="step"><button id="g-m" aria-label="Kortare tid för alla">−</button><span class="val" id="g-v"></span><button id="g-p" aria-label="Längre tid för alla">+</button></div></div>
    <div class="gen"><div><b>Vilotid</b><small id="g2-sub"></small></div><div class="step"><button id="g2-m" aria-label="Kortare vila för alla">−</button><span class="val" id="g2-v"></span><button id="g2-p" aria-label="Längre vila för alla">+</button></div></div>
    <div class="gen"><div><b>Paus mellan varv</b><small>Längre vila mellan varven</small></div><div class="step"><button id="g3-m" aria-label="Kortare paus mellan varv">−</button><span class="val" id="g3-v"></span><button id="g3-p" aria-label="Längre paus mellan varv">+</button></div></div>
    <button class="rst" id="g-r" type="button">Återställ till standard</button><p class="hint">Tryck på en övning för att börja där</p><div id="t-list"></div></div>
  </section>

  <section id="run" class="hidden" aria-live="off">
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="phase" id="phase"></div>

  function buildToday(){

    segs=[{t:'prep',d:5,n:'Gör dig redo',sub:'Uppvärmning först',ill:WARM[0],dim:true}];

  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&want)wl()});
  $('start-today').addEventListener('click',function(){start('today')});
  renderToday();
  function jump(dir){
    var ex=function(i){return segs[i].t!=='rest'&&segs[i].t!=='prep'&&segs[i].t!=='rbreak'};
    var i=idx+dir;
    while(i>=0&&i<segs.length&&!ex(i)&&segs[i].t!=='done')i+=dir;
    if(i<0||i>=segs.length)i=idx;
    enter(i,!running);
  }
  $('prev').addEventListener('click',function(){jump(-1)});
  $('next').addEventListener('click',function(){jump(1)});
  $('pause').addEventListener('click',toggle);
  $('stop').addEventListener('click',stop);
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
